id = "herdr-call"
name = "Herdr Call"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Talk to and manage Herdr sessions through a private ElevenLabs voice call."
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["npm", "run", "build"]

[[startup]]
command = ["node", "dist/server/main.js", "--provision-only"]

# Opens the call tab on every Herdr start, but only where the plugin config sets
# open_on_startup = true. Without that flag this exits without touching the session.
[[startup]]
command = ["node", "dist/server/start.js", "--startup"]

[[actions]]
id = "start"
title = "Start or focus voice call"
contexts = ["workspace", "tab", "pane", "global"]
command = ["node", "dist/server/start.js"]

[[panes]]
id = "call"
title = "Herdr Call"
placement = "tab"
command = ["node", "dist/server/main.js"]
