<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17171a" />
    <meta name="herdr-call-token" content="__HERDR_CALL_TOKEN__" />
    <title>Herdr Call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="herdr-call home">
          <span class="brand-mark" aria-hidden="true">❯_</span>
          <span>herdr-call</span>
        </a>
        <div class="privacy-status">
          <span class="privacy-dot" aria-hidden="true"></span>
          Private connection
        </div>
      </header>

      <section class="call-stage" aria-labelledby="call-title">
        <div class="heading-group">
          <p class="eyebrow"><span aria-hidden="true"></span>Voice plugin</p>
          <h1 id="call-title">Talk to <em>your agents.</em></h1>
          <p id="call-description" class="description">
            Check progress, give direction, and keep work moving—hands free.
          </p>
        </div>

        <div class="voice-field" aria-hidden="true">
          <span class="voice-orb">
            <span class="voice-orb-fill">
              <span class="voice-color voice-color-sky"></span>
              <span class="voice-color voice-color-violet"></span>
              <span class="voice-color voice-color-rose"></span>
              <span class="voice-color voice-color-gold"></span>
            </span>
            <span class="voice-sheen"></span>
          </span>
        </div>

        <div class="status-line" aria-live="polite">
          <span id="status-dot" class="status-dot" data-state="ready" aria-hidden="true"></span>
          <span id="status-text">Ready</span>
          <span id="call-duration" class="duration" hidden>00:00</span>
        </div>

        <p id="error-message" class="error-message" role="alert" hidden></p>

        <div id="start-controls" class="start-controls">
          <button id="start-call" class="button button-primary" type="button">Start call</button>
          <p>Microphone access is requested once. Audio connects directly to ElevenLabs.</p>
        </div>

        <div id="call-controls" class="call-controls" hidden>
          <button id="mute-call" class="button button-secondary" type="button" aria-pressed="false">
            Mute
          </button>
          <button id="end-call" class="button button-danger" type="button">End call</button>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
